[package]
name = "connectdirect-precheck"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "ConnectDirectPrecheck"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
